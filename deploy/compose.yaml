# open-rmm console on a single Linux host.
#
#   cp .env.example .env    # then set the passwords
#   docker compose up -d
#
# Only the agents endpoint is published. PostgreSQL lives on an internal
# network with no route to the outside.

name: open-rmm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OPENRMM_DB_PASSWORD: ${OPENRMM_DB_PASSWORD:?set OPENRMM_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openrmm"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  # Internet-facing agents endpoint (relay). No database, no CA private key.
  # When it runs on a separate DMZ host, use deploy/dmz/compose.yaml there
  # and point OPENRMM_GATEWAY_TUNNEL at it.
  gateway:
    image: ${OPENRMM_IMAGE:-open-rmm:dev}
    build:
      context: ..
    restart: unless-stopped
    environment:
      OPENRMM_LISTEN: ":8443"
      OPENRMM_TUNNEL_LISTEN: ":8444"
      OPENRMM_TLS_CERT: /run/openrmm/pki/gateway.crt
      OPENRMM_TLS_KEY: /run/openrmm/pki/gateway.key
      OPENRMM_AGENTS_CA_CERT: /run/openrmm/pki/agents-ca.crt
    volumes:
      - ./pki/gateway:/run/openrmm/pki:ro
    ports:
      - "${OPENRMM_PUBLIC_PORT:-443}:8443"
    networks: [public, tunnel]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m

  # Internal side of the agents endpoint: sessions, enrollment, certificate
  # issuance, job dispatch. Opens the tunnel to the gateway; publishes nothing.
  core:
    image: ${OPENRMM_IMAGE:-open-rmm:dev}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/openrmm-core"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/openrmm-core", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENRMM_DATABASE_URL: postgres://openrmm:${OPENRMM_DB_PASSWORD}@db:5432/openrmm?sslmode=disable
      OPENRMM_AGENTS_CA_CERT: /run/openrmm/pki/agents-ca.crt
      OPENRMM_AGENTS_CA_KEY: /run/openrmm/pki/agents-ca.key
      OPENRMM_ROOT_CA: /run/openrmm/pki/root-ca.crt
      OPENRMM_CORE_CERT: /run/openrmm/pki/core.crt
      OPENRMM_CORE_KEY: /run/openrmm/pki/core.key
      OPENRMM_GATEWAY_TUNNEL: ${OPENRMM_GATEWAY_TUNNEL:-gateway:8444}
      OPENRMM_GATEWAY_NAME: ${OPENRMM_GATEWAY_NAME:-}
      # Optional Vision One connector (read-only API key in secrets/core).
      OPENRMM_VISIONONE_TENANT: ${OPENRMM_VISIONONE_TENANT:-}
      OPENRMM_VISIONONE_REGION: ${OPENRMM_VISIONONE_REGION:-eu}
      OPENRMM_VISIONONE_KEY_FILE: /run/openrmm/secrets/visionone-key
    volumes:
      - ./pki/core:/run/openrmm/pki:ro
      - ./secrets/core:/run/openrmm/secrets:ro
      - shell-socket:/run/openrmm-shell
      # Package library, written by the web console, served to agents.
      - packages:/var/lib/openrmm/packages:ro
    # The tunnel network also gives the outbound HTTPS the Vision One
    # connector needs.
    networks: [internal, tunnel]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m

  # Operator web console. Published on the LAN only (OPENRMM_CONSOLE_BIND),
  # never on the internet. Needs outbound HTTPS to Microsoft for sign-in, and
  # to GitHub and the software vendors for the winget catalog.
  server:
    image: ${OPENRMM_IMAGE:-open-rmm:dev}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/openrmm-server"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/openrmm-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      signer:
        condition: service_healthy
    environment:
      OPENRMM_DATABASE_URL: postgres://openrmm:${OPENRMM_DB_PASSWORD}@db:5432/openrmm?sslmode=disable
      OPENRMM_PUBLIC_URL: ${OPENRMM_PUBLIC_URL:?set OPENRMM_PUBLIC_URL in .env}
      OPENRMM_HTTP_LISTEN: ":8080"
      OPENRMM_TLS_CERT: ${OPENRMM_CONSOLE_TLS_CERT:-}
      OPENRMM_TLS_KEY: ${OPENRMM_CONSOLE_TLS_KEY:-}
      OPENRMM_OIDC_ISSUER: ${OPENRMM_OIDC_ISSUER:?set OPENRMM_OIDC_ISSUER in .env}
      OPENRMM_OIDC_CLIENT_ID: ${OPENRMM_OIDC_CLIENT_ID:?set OPENRMM_OIDC_CLIENT_ID in .env}
      OPENRMM_OIDC_CLIENT_SECRET_FILE: /run/openrmm/secrets/oidc-client-secret
      OPENRMM_MFA_CLAIM: ${OPENRMM_MFA_CLAIM:-amr}
      OPENRMM_TENANT_MAP: ${OPENRMM_TENANT_MAP:?set OPENRMM_TENANT_MAP in .env}
      OPENRMM_SIGNER_SOCKET: /run/openrmm-signer/signer.sock
      # Central console: link listener for customer consoles (see .env.example).
      OPENRMM_FEDERATION_LISTEN: ${OPENRMM_FEDERATION_LISTEN:-}
      OPENRMM_FEDERATION_PUBLIC_ADDR: ${OPENRMM_FEDERATION_PUBLIC_ADDR:-}
      # Customer console: the central console's directory, if linked.
      OPENRMM_FEDERATION_ISSUER: ${OPENRMM_FEDERATION_ISSUER:-}
      OPENRMM_FEDERATION_CLIENT_ID: ${OPENRMM_FEDERATION_CLIENT_ID:-}
      OPENRMM_FEDERATION_MFA_CLAIM: ${OPENRMM_FEDERATION_MFA_CLAIM:-amr}
      OPENRMM_FEDERATION_TENANT_MAP: ${OPENRMM_FEDERATION_TENANT_MAP:-}
      OPENRMM_FEDERATION_MAX_ROLE: ${OPENRMM_FEDERATION_MAX_ROLE:-}
    volumes:
      - ./secrets/server:/run/openrmm/secrets:ro
      - ./console-tls:/run/openrmm/tls:ro
      - signer-socket:/run/openrmm-signer
      - shell-socket:/run/openrmm-shell
      - packages:/var/lib/openrmm/packages
    ports:
      - "${OPENRMM_CONSOLE_BIND:-127.0.0.1:8080}:8080"
      - "${OPENRMM_FEDERATION_BIND:-127.0.0.1:8445}:8445"
    networks: [internal, public]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m

  # Holds the job signing key. No published port, no database access: it is
  # reachable only through the Unix socket shared with the server, and talks
  # only to Microsoft (to fetch the keys that sign operator tokens).
  signer:
    image: ${OPENRMM_IMAGE:-open-rmm:dev}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/openrmm-signer"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/openrmm-signer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      OPENRMM_SIGNER_KEY: /run/openrmm/secrets/job-signing.key
      OPENRMM_SIGNER_SOCKET: /run/openrmm-signer/signer.sock
      OPENRMM_SIGNER_STATE: /var/lib/openrmm-signer/used-tokens.json
      OPENRMM_OIDC_ISSUER: ${OPENRMM_OIDC_ISSUER:?set OPENRMM_OIDC_ISSUER in .env}
      OPENRMM_OIDC_CLIENT_ID: ${OPENRMM_OIDC_CLIENT_ID:?set OPENRMM_OIDC_CLIENT_ID in .env}
      OPENRMM_MFA_CLAIM: ${OPENRMM_MFA_CLAIM:-amr}
      OPENRMM_TENANT_MAP: ${OPENRMM_TENANT_MAP:?set OPENRMM_TENANT_MAP in .env}
      # Commands approved by a central console's operators (federation).
      OPENRMM_FEDERATION_ISSUER: ${OPENRMM_FEDERATION_ISSUER:-}
      OPENRMM_FEDERATION_CLIENT_ID: ${OPENRMM_FEDERATION_CLIENT_ID:-}
      OPENRMM_FEDERATION_MFA_CLAIM: ${OPENRMM_FEDERATION_MFA_CLAIM:-amr}
      OPENRMM_FEDERATION_TENANT_MAP: ${OPENRMM_FEDERATION_TENANT_MAP:-}
      OPENRMM_FEDERATION_MAX_ROLE: ${OPENRMM_FEDERATION_MAX_ROLE:-}
    volumes:
      - ./secrets/signer:/run/openrmm/secrets:ro
      - signer-socket:/run/openrmm-signer
      - signer-state:/var/lib/openrmm-signer
    networks: [signer-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m

  # One-off administration: docker compose run --rm admin <area> <command> ...
  admin:
    image: ${OPENRMM_IMAGE:-open-rmm:dev}
    profiles: [tools]
    entrypoint: ["/usr/local/bin/openrmm-admin"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENRMM_DATABASE_URL: postgres://openrmm:${OPENRMM_DB_PASSWORD}@db:5432/openrmm?sslmode=disable
    volumes:
      - ./pki:/pki
    # Scratch space for verifying module bundles before publishing.
    tmpfs: [/tmp]
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true
  public: {}
  # Outbound only (nothing publishes ports on it): the signer's way to Microsoft.
  signer-egress: {}
  # Core → gateway tunnel. With a separate DMZ host the core reaches the
  # gateway over the network instead (OPENRMM_GATEWAY_TUNNEL).
  tunnel: {}

volumes:
  db-data: {}
  packages: {}
  signer-socket: {}
  shell-socket: {}
  signer-state: {}
