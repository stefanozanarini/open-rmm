syntax = "proto3";

package openrmm.v1;

option go_package = "github.com/stefanozanarini/open-rmm/gen/openrmm/v1;openrmmv1";

// EnrollmentService is the only RPC reachable without a client certificate.
// An agent exchanges a single-use enrollment token and a locally generated
// CSR for its client certificate.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// AgentService requires a valid agent client certificate (mTLS).
service AgentService {
  // Connect is the long-lived stream opened by the agent. The console never
  // opens connections towards endpoints: every command travels on this stream.
  rpc Connect(stream AgentMessage) returns (stream ConsoleMessage);

  // RenewCertificate issues a new certificate for a new key pair generated
  // by the agent. The current certificate stays valid until the agent first
  // connects with the new one, so a lost response cannot lock it out.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // GetModule streams a signed module: the first chunk carries the signed
  // manifest, the following ones the archive bytes. Only approved agents may
  // download modules.
  rpc GetModule(GetModuleRequest) returns (stream ModuleChunk);

  // GetPackage streams a software package referenced (by SHA-256) by one of
  // the agent's unfinished jobs. The agent verifies size and hash.
  rpc GetPackage(GetPackageRequest) returns (stream PackageChunk);

  // GetAgentRelease streams the executables of a signed release offered to
  // the agent (see AgentUpdateOffer).
  rpc GetAgentRelease(GetAgentReleaseRequest) returns (stream ReleaseChunk);

  // Shell carries an interactive shell session opened by a signed job of a
  // module with the interactive_shell capability. The agent opens the
  // stream; its first frame names the job.
  rpc Shell(stream ShellFrame) returns (stream ShellFrame);
}

// ShellFrame is a piece of an interactive shell session: terminal output
// from the agent, keystrokes and window size towards it.
message ShellFrame {
  string job_id = 1;    // first frame of each side
  bytes data = 2;
  uint32 cols = 3;      // resize, when both are set
  uint32 rows = 4;
  bool close = 5;       // end of the session
  string error = 6;
  string tenant_id = 7; // broker: first frame of the console
}

message GetAgentReleaseRequest {
  string version = 1;
  string platform = 2;
}

message ReleaseChunk {
  // File the data belongs to; files are sent one after the other.
  string file = 1;
  bytes data = 2;
}

message GetModuleRequest {
  string module = 1;
  string version = 2;
}

message GetPackageRequest {
  string job_id = 1;
  bytes sha256 = 2;
}

message PackageChunk {
  bytes data = 1;
}

// PackageRef pins a package of the console's library in a signed job.
message PackageRef {
  bytes sha256 = 1;
  string file_name = 2;
  int64 size = 3;
}

message ModuleChunk {
  // Set in the first chunk only.
  SignedEnvelope manifest = 1;
  bytes data = 2;
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  bytes certificate_der = 1;
  repeated bytes chain_der = 2;
}

message HostInfo {
  string hostname = 1;
  string os = 2;          // runtime.GOOS
  string os_version = 3;
  string arch = 4;        // runtime.GOARCH
  string agent_version = 5;
  string machine_id = 6;  // stable OS machine identifier, used to spot re-enrollments
  string os_family = 7;   // "client", "server" or "unknown"
}

message EnrollRequest {
  string token = 1;
  bytes csr_der = 2;
  HostInfo host = 3;
}

message EnrollResponse {
  string tenant_id = 1;
  string agent_id = 2;
  bytes certificate_der = 3;
  // Intermediate certificates, leaf issuer first. Excludes the pinned root.
  repeated bytes chain_der = 4;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    JobUpdate job_update = 3;
    UpdateStatus update_status = 4;
    PolicyResult policy_result = 5;
  }
}

// PolicyResult is the outcome of one scheduled run of a policy rule. It is
// acknowledged with a JobUpdateAck carrying run_id.
message PolicyResult {
  string run_id = 1;
  string policy_id = 2;
  int64 policy_version = 3;
  string rule_id = 4;
  JobUpdate.State state = 5;
  bytes result_json = 6;
  string error = 7;
  int64 started_unix_ms = 8;
  int64 finished_unix_ms = 9;
}

// UpdateStatus reports the progress of an agent update.
message UpdateStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_DOWNLOADING = 1;
    STATE_STAGED = 2;      // verified and ready; the watchdog applies it
    STATE_APPLIED = 3;     // running the new version
    STATE_REJECTED = 4;    // not installed (signature, version, hashes)
    STATE_ROLLED_BACK = 5; // the new version failed and was reverted
  }
  string version = 1;
  State state = 2;
  string error = 3;
}

message ConsoleMessage {
  oneof msg {
    HelloAck hello_ack = 1;
    SignedEnvelope job = 2;
    JobUpdateAck job_update_ack = 3;
    AgentUpdateOffer agent_update = 4;
    PolicySet policy_set = 5;
  }
}

// PolicySet is the complete set of policies the agent should apply. Sent on
// connect and whenever it changes; policies missing from it are removed.
// Each policy is signed (domain openrmm/policy/v1).
message PolicySet {
  repeated SignedEnvelope policies = 1;
}

// AgentUpdateOffer proposes a release. The agent installs it only if the
// manifest is signed by a trusted release key and is newer than itself.
message AgentUpdateOffer {
  SignedEnvelope manifest = 1;
}

// JobUpdateAck confirms that the console stored a final job update, so the
// agent can drop it from its outbox.
message JobUpdateAck {
  string job_id = 1;
}

message Hello {
  HostInfo host = 1;
}

message HelloAck {
  int32 heartbeat_interval_seconds = 1;
  // approval_pending is true while an operator has not approved the agent.
  // A pending agent stays connected but receives no jobs.
  bool approval_pending = 2;
}

message Heartbeat {
  int64 sent_at_unix_ms = 1;
}

// SignedEnvelope carries a serialized payload and an Ed25519 signature over
// it. The payload is signed as opaque bytes, so no canonical re-encoding is
// ever needed to verify it.
message SignedEnvelope {
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

// Job is the payload of a SignedEnvelope sent to an agent.
message Job {
  string job_id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string module = 4;
  string module_version = 5;
  bytes module_sha256 = 6;
  string action = 7;
  bytes params_json = 8;
  int64 not_before_unix = 9;
  int64 expires_unix = 10;
  bytes nonce = 11;
  // Packages the agent downloads into the work directory before running
  // the module (e.g. an MSI to install).
  repeated PackageRef packages = 12;
}

message JobUpdate {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_ACCEPTED = 1;
    STATE_REJECTED = 2;
    STATE_RUNNING = 3;
    STATE_SUCCEEDED = 4;
    STATE_FAILED = 5;
  }
  string job_id = 1;
  State state = 2;
  bytes result_json = 3;
  string error = 4;
  int32 progress_percent = 5;
  string message = 6;
}
