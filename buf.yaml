version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Connect is a bidirectional stream of message envelopes; the generic
    # Request/Response naming does not describe them.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
